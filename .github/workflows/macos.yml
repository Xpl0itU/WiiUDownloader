name: macOS

# Branch/PR runs build and upload a downloadable .app only. The universal DMG is
# assembled and released exclusively from tag pushes (see the release job's if).
on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  MACOS_INTEL_TARGET: &macos-intel-target "macos-15-intel"
  MACOS_ARM_TARGET: &macos-arm-target "macos-14"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [*macos-intel-target, *macos-arm-target]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
      - name: Install Homebrew Dependencies
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: create-dmg dylibbundler gtk4 libadwaita librsvg shared-mime-info adwaita-icon-theme
          cache: yes
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: true
          cache-dependency-path: |
            go.sum
            cmd/WiiUDownloader/go.sum
      - name: Build
        run: |
          curl --insecure -Lo db.go -H "User-Agent: NUSspliBuilder/2.1" "https://napi.v10lator.de/db?t=go"
          if grep -q "var titleEntry =" db.go; then
            if grep -q "type TitleEntry struct" db.go; then
              sed -i '' '/type TitleEntry struct/,/}/d' db.go
            fi
            sed -i '' 's/var titleEntry =/func init() { TitleDatabase =/' db.go
            echo "}" >> db.go
          fi
          cd cmd/WiiUDownloader && go build -o ../main .
      - name: Package
        run: |
          python3 data/create_bundle.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WiiUDownloader-App-${{ matrix.os }}
          path: out/WiiUDownloader.app
          if-no-files-found: error

  release:
    name: Release Universal Binary
    # Tag pushes only: branch/PR runs stop after the build job's artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    needs: build
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install Homebrew Dependencies
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: create-dmg
          cache: yes
      - name: Download Intel Artifact
        uses: actions/download-artifact@v8
        with:
          name: WiiUDownloader-App-${{ env.MACOS_INTEL_TARGET }}
          path: intel_dist
      - name: Download ARM Artifact
        uses: actions/download-artifact@v8
        with:
          name: WiiUDownloader-App-${{ env.MACOS_ARM_TARGET }}
          path: arm_dist
      - name: Merge Universal Binary
        run: |
          python3 data/merge_universal_app.py "intel_dist" "arm_dist" "out/WiiUDownloader.app"
      - name: Sign and Create DMG
        run: |
          codesign --deep --force --sign - out/WiiUDownloader.app

          create-dmg \
           --volname "WiiUDownloader" \
           --window-pos 200 120 \
           --window-size 800 400 \
           --icon-size 100 \
           --icon "WiiUDownloader.app" 200 190 \
           --hide-extension "WiiUDownloader.app" \
           --app-drop-link 600 185 \
           "WiiUDownloader-macOS-Universal.dmg" \
           "out/"
      - name: Upload macOS Artifact
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: True
          makeLatest: True
          omitBody: True
          omitBodyDuringUpdate: True
          omitNameDuringUpdate: True
          artifacts: "WiiUDownloader-macOS-Universal.dmg"
          token: ${{ secrets.GITHUB_TOKEN }}
