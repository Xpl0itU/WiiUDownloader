name: macOS

# A tag push publishes a release. A push whose head commit message starts with
# BUILD_NOW builds the same thing and uploads the same files as workflow
# artifacts instead, so a build can be tried without cutting a release. Every
# other push stops at the gates below without building anything.
on:
  push:

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  MACOS_INTEL_TARGET: &macos-intel-target "macos-15-intel"
  MACOS_ARM_TARGET: &macos-arm-target "macos-14"

jobs:
  build:
    name: Build (${{ matrix.os }})
    if: github.ref_type == 'tag' || (github.event.head_commit != null && startsWith(github.event.head_commit.message, 'BUILD_NOW'))
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [*macos-intel-target, *macos-arm-target]
    steps:
      - name: What this run does
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Tag ${{ github.ref_name }}: the built files are uploaded and then published as a release."
          else
            echo "BUILD_NOW commit: the built files are uploaded as artifacts. No release is created."
          fi
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install Homebrew Dependencies
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: create-dmg dylibbundler gtk4 libadwaita librsvg shared-mime-info adwaita-icon-theme gobject-introspection
          cache: yes
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: true
          cache-dependency-path: |
            go.sum
            cmd/WiiUDownloader/go.sum
      - name: Build
        run: |
          curl --insecure -Lo db.go -H "User-Agent: NUSspliBuilder/2.1" "https://napi.v10lator.de/db?t=go"
          if grep -q "var titleEntry =" db.go; then
            if grep -q "type TitleEntry struct" db.go; then
              sed -i '' '/type TitleEntry struct/,/}/d' db.go
            fi
            sed -i '' 's/var titleEntry =/func init() { TitleDatabase =/' db.go
            echo "}" >> db.go
          fi
          cd cmd/WiiUDownloader && go build -o ../main .
      - name: Package
        run: |
          python3 data/create_bundle.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WiiUDownloader-App-${{ matrix.os }}
          path: out/WiiUDownloader.app
          if-no-files-found: error

  release:
    name: Universal binary
    # Runs for a tag so the DMG can be published, and for a BUILD_NOW commit so
    # the same DMG can be downloaded from the run. The publish step below is what
    # stays tag-only.
    if: github.ref_type == 'tag' || (github.event.head_commit != null && startsWith(github.event.head_commit.message, 'BUILD_NOW'))
    runs-on: macos-14
    needs: build
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install Homebrew Dependencies
        uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: create-dmg
          cache: yes
      - name: Download Intel Artifact
        uses: actions/download-artifact@v8
        with:
          name: WiiUDownloader-App-${{ env.MACOS_INTEL_TARGET }}
          path: intel_dist
      - name: Download ARM Artifact
        uses: actions/download-artifact@v8
        with:
          name: WiiUDownloader-App-${{ env.MACOS_ARM_TARGET }}
          path: arm_dist
      - name: Merge Universal Binary
        run: |
          python3 data/merge_universal_app.py "intel_dist" "arm_dist" "out/WiiUDownloader.app"
      - name: Sign and Create DMG
        run: |
          codesign --deep --force --sign - out/WiiUDownloader.app

          create-dmg \
           --volname "WiiUDownloader" \
           --window-pos 200 120 \
           --window-size 800 400 \
           --icon-size 100 \
           --icon "WiiUDownloader.app" 200 190 \
           --hide-extension "WiiUDownloader.app" \
           --app-drop-link 600 185 \
           "WiiUDownloader-macOS-Universal.dmg" \
           "out/"
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WiiUDownloader-macOS-Universal
          path: "WiiUDownloader-macOS-Universal.dmg"
      - name: Upload macOS Artifact to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: True
          makeLatest: True
          omitBody: True
          omitBodyDuringUpdate: True
          omitNameDuringUpdate: True
          artifacts: "WiiUDownloader-macOS-Universal.dmg"
          token: ${{ secrets.GITHUB_TOKEN }}
