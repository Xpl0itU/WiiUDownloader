name: MSYS2

# Releases are published from tag pushes only.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  GOPROXY: direct

jobs:
  msys2-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: true
          update: true
          cache: true
          install: zip git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-gobject-introspection mingw-w64-ucrt-x86_64-libadwaita mingw-w64-ucrt-x86_64-adwaita-icon-theme mingw-w64-ucrt-x86_64-pkg-config mingw-w64-ucrt-x86_64-go mingw-w64-ucrt-x86_64-ntldd-git mingw-w64-ucrt-x86_64-imagemagick curl
      - name: Build
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          export PATH=$PATH:$(cygpath -u $(go env GOPATH)/bin)
          curl --insecure -Lo db.go -H "User-Agent: NUSspliBuilder/2.1" "https://napi.v10lator.de/db?t=go"
          if grep -q "var titleEntry =" db.go; then
            if grep -q "type TitleEntry struct" db.go; then
              sed -i '/type TitleEntry struct/,/}/d' db.go
            fi
            sed -i 's/var titleEntry =/func init() { TitleDatabase =/' db.go
            echo "}" >> db.go
          fi
          magick data/WiiUDownloader.png -define icon:auto-resize=256,128,64,48,32,16 cmd/WiiUDownloader/WiiUDownloader.ico
          (cd cmd/WiiUDownloader && go generate && go build -ldflags="-H=windowsgui" -o ../../main.exe .)
      - name: Deploy WiiUDownloader
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/lib dist/share/icons dist/share/glib-2.0/schemas

          test -f main.exe || { echo "::error::main.exe was not built"; exit 1; }
          prefix=$(cygpath -m "${MSYSTEM_PREFIX}")
          dll_paths() {
            "${MSYSTEM_PREFIX}/bin/ntldd" -R "$1" |
              awk -v p="$prefix" '$2 == "=>" { gsub(/\\/, "/", $3); if (index($3, p) == 1) print $3 }' |
              sort -u | cygpath -f - -u
          }

          dll_paths main.exe | while IFS= read -r dll; do cp "$dll" dist/; done

          cp -r "${MSYSTEM_PREFIX}/lib/gdk-pixbuf-2.0" ./dist/lib/gdk-pixbuf-2.0

          for loader in dist/lib/gdk-pixbuf-2.0/2.10.0/loaders/*.dll; do
            dll_paths "$loader" || echo "::warning::could not resolve $loader"
          done | sort -u | while IFS= read -r dll; do cp -n "$dll" dist/ 2>/dev/null || true; done

          cp -r "${MSYSTEM_PREFIX}/share/icons/"* ./dist/share/icons/
          cp -r "${MSYSTEM_PREFIX}/share/glib-2.0/schemas/"* dist/share/glib-2.0/schemas/

          glib-compile-schemas.exe dist/share/glib-2.0/schemas/
          gdk-pixbuf-query-loaders > dist/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
          cp main.exe dist/WiiUDownloader.exe

          missing=0
          while IFS= read -r dll; do
            if [ ! -f "dist/${dll##*/}" ]; then
              echo "::error::${dll##*/} is missing from the bundle"
              missing=$((missing + 1))
            fi
          done < <(dll_paths main.exe)
          echo "Bundled $(find dist -maxdepth 1 -name '*.dll' | wc -l) DLLs"
          [ "$missing" -eq 0 ] || exit 1

          cd dist
          rm -f libx265-*.dll
          zip -9 -r ../WiiUDownloader-Windows.zip .
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WiiUDownloader-Windows
          path: WiiUDownloader-Windows.zip
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: True
          makeLatest: True
          omitBody: True
          omitBodyDuringUpdate: True
          omitNameDuringUpdate: True
          artifacts: "WiiUDownloader-Windows.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
